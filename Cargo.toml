[package]
name = "salvis"
version = "1.1.0"
edition = "2024"
description = "Znanium.ru downloader — выгрузка книги в векторный PDF из отрисованных DOM-SVG страниц"
license = "MIT"

[[bin]]
name = "salvis"
path = "src/main.rs"

[dependencies]
playwright-rs = "0.15"
tokio = { version = "1", features = ["full"] }
# printpdf::Svg::parse убран намеренно: он прогоняет SVG через svg2pdf, а затем
# пересобирает получившийся XObject, оставляя в его /Resources только ColorSpace.
# Все Form XObject'ы (группы с clip-path/маской/прозрачностью — то есть весь
# текстовый слой книги), ExtGState, Shading и Pattern при этом теряют свои имена
# и не отрисовываются. Работаем с svg2pdf/pdf-writer напрямую.
svg2pdf = "0.13"
pdf-writer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3           # Максимальная оптимизация по скорости выполнения
lto = true              # Межпроцедурная оптимизация (Link Time Optimization)
codegen-units = 1       # Максимально раскрывает потенциал LTO (немного замедляет сборку, но ускоряет работу программы)
strip = true            # Удаляет отладочные символы для уменьшения размера файла
debug = false           # Полное отключение отладочной информации